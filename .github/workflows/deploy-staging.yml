name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AgentWhistle Staging
    runs-on: ubuntu-latest
    environment: agentwhistle-staging

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            git config --global --add safe.directory /home/agentwhistle-lab-document/htdocs/lab-document.agentwhistle.com/lab_document_management

            cd /home/agentwhistle-lab-document/htdocs/lab-document.agentwhistle.com/lab_document_management

            git fetch origin
            git reset --hard origin/main

            npm --prefix client install
            npm --prefix client run build

            npm --prefix server install

            rm -rf client/public/*
            cp -r client/dist/* client/public/

            pm2 describe lab-doc-api >/dev/null 2>&1 && \
            pm2 reload ecosystem.config.js --only lab-doc-api --env staging --update-env || \
            pm2 start ecosystem.config.js --only lab-doc-api --env staging

            pm2 save
